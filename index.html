<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musify - Modern Web Music Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="background-decor"></div>
  <div class="app-container glass">
    <header class="app-header">
      <div class="logo">
        <i class="fa-solid fa-compact-disc spin-logo"></i>
        <h1>Musify</h1>
      </div>
      <div class="upload-section">
        <label for="audio-upload" class="btn btn-primary">
          <i class="fa-solid fa-cloud-arrow-up"></i> Upload Audio
        </label>
        <input type="file" id="audio-upload" accept="audio/*" multiple hidden>
      </div>
    </header>

    <main class="app-main">
      <section class="controls-panel">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="Search songs or artists...">
        </div>
        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">All Songs</button>
          <button class="tab-btn" data-filter="favorites"><i class="fa-solid fa-heart"></i> Favorites</button>
        </div>
      </section>

      <section class="library-section">
        <div class="section-title">
          <h2 id="library-title">Music Library</h2>
          <span id="song-count" class="badge">0 tracks</span>
        </div>
        <div id="song-list" class="song-list">
          <div class="empty-state">
            <i class="fa-solid fa-music"></i>
            <p>No audio files added yet. Upload local audio files to start listening!</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="player-bar glass">
      <div class="now-playing">
        <div class="album-art" id="player-album-art">
          <i class="fa-solid fa-music"></i>
        </div>
        <div class="track-details">
          <span class="track-title" id="player-title">No track selected</span>
          <span class="track-artist" id="player-artist">Select a song to play</span>
        </div>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button id="prev-btn" class="ctrl-btn" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
          <button id="play-btn" class="ctrl-btn play-main" title="Play"><i class="fa-solid fa-play"></i></button>
          <button id="next-btn" class="ctrl-btn" title="Next"><i class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="progress-container">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-bar" value="0" min="0" max="100" class="slider">
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <div class="volume-container">
          <button id="mute-btn" class="ctrl-btn icon-only"><i class="fa-solid fa-volume-high"></i></button>
          <input type="range" id="volume-bar" value="100" min="0" max="100" class="slider volume-slider">
        </div>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
